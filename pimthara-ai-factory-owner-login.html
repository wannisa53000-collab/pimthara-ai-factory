<!DOCTYPE html>  <html lang="th">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>PIMTHARA AI FACTORY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
<style>  
:root {  
  --bg:#0b1020; --panel:#131b2e; --panel2:#19243a;  
  --line:#2b3852; --text:#f1f5ff; --muted:#a0aec5;  
  --accent:#70a5ff; --green:#57d6a0; --yellow:#ffd166;  
  --red:#ff7777;  
}  
* { box-sizing:border-box; }  
body {  
  margin:0; background:var(--bg); color:var(--text);  
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;  
}  
button,input,select,textarea { font:inherit; }  
button { cursor:pointer; }  
.app { min-height:100vh; }  
.topbar {  
  display:flex; align-items:center; justify-content:space-between;  
  gap:12px; padding:16px 20px; border-bottom:1px solid var(--line);  
  background:#0d1425; position:sticky; top:0; z-index:10;  
}  
.brand { display:flex; align-items:center; gap:12px; }  
.logo {  
  display:grid; place-items:center; width:42px; height:42px;  
  border-radius:13px; background:linear-gradient(135deg,#4b8cff,#9b7bff);  
  font-size:22px; font-weight:900;  
}  
.brand h1 { font-size:17px; margin:0; }  
.brand p { color:var(--muted); font-size:12px; margin:3px 0 0; }  
.top-actions { display:flex; gap:8px; align-items:center; }  
.btn {  
  border:1px solid var(--line); background:var(--panel2);  
  color:var(--text); padding:10px 13px; border-radius:10px;  
}  
.btn.primary { background:#356fe0; border-color:#568cff; }  
.btn:active { transform:scale(.98); }  
.layout { display:grid; grid-template-columns:225px minmax(0,1fr); }  
.sidebar {  
  border-right:1px solid var(--line); min-height:calc(100vh - 75px);  
  padding:18px 12px; background:#0e1628;  
}  
.nav-label {  
  color:var(--muted); font-size:11px; letter-spacing:1px;  
  margin:20px 10px 8px;  
}  
.nav {  
  display:flex; gap:10px; align-items:center; width:100%;  
  border:1px solid transparent; background:transparent; color:#c4cfe2;  
  padding:12px; border-radius:10px; text-align:left; margin:3px 0;  
}  
.nav:hover,.nav.active {  
  background:#1b2a45; color:white; border-color:#30486e;  
}  
.nav .ico { width:22px; text-align:center; }  
.main { padding:24px; min-width:0; }  
.page-head {  
  display:flex; align-items:flex-start; justify-content:space-between;  
  gap:14px; margin-bottom:22px; flex-wrap:wrap;  
}  
.page-head h2 { font-size:25px; margin:0 0 6px; }  
.muted { color:var(--muted); }  
.small { font-size:12px; }  
.grid { display:grid; gap:14px; }  
.stats { grid-template-columns:repeat(4,minmax(0,1fr)); }  
.card {  
  background:var(--panel); border:1px solid var(--line);  
  border-radius:15px; padding:17px; min-width:0;  
}  
.stat-title { color:var(--muted); font-size:13px; }  
.stat-number { font-size:29px; font-weight:800; margin:8px 0 4px; }  
.section-title {  
  display:flex; justify-content:space-between; align-items:center;  
  gap:10px; flex-wrap:wrap; margin:26px 0 12px;  
}  
.section-title h3 { margin:0; font-size:17px; }  
.pill {  
  display:inline-flex; align-items:center; gap:5px; border-radius:20px;  
  padding:5px 9px; font-size:11px; border:1px solid var(--line);  
  color:#dbe6fb; background:#1b2940;  
}  
.pill.green { color:#7ff0bc; background:#123729; border-color:#285e49; }  
.pill.yellow { color:#ffe09a; background:#3a301a; border-color:#66532c; }  
.pill.red { color:#ffaaaa; background:#421f2b; border-color:#733548; }  
.pill.blue { color:#a9caff; background:#172e51; border-color:#31588c; }  
.two-col { grid-template-columns:1.4fr 1fr; }  
.list { display:grid; gap:9px; }  
.list-row {  
  display:flex; justify-content:space-between; align-items:center;  
  gap:12px; padding:12px; border-radius:10px; background:#10192b;  
  border:1px solid #25334c;  
}  
.row-main { min-width:0; }  
.row-main strong { display:block; font-size:13px; }  
.row-main small { display:block; color:var(--muted); margin-top:4px; }  
.zone-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }  
.zone {  
  border:1px solid var(--line); border-radius:14px; padding:14px;  
  background:linear-gradient(135deg,#17243a,#11192a);  
}  
.zone h3 { margin:0 0 5px; font-size:15px; }  
.zone p { margin:0 0 12px; font-size:12px; color:var(--muted); }  
.people { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }  
.person {  
  border:1px solid #34425b; background:#202e45; color:var(--text);  
  padding:10px 7px; border-radius:11px; text-align:left; min-width:0;  
}  
.person:hover { border-color:var(--accent); background:#263b5c; }  
.person .face { font-size:23px; display:block; margin-bottom:6px; }  
.person strong { display:block; font-size:13px; }  
.person small { display:block; color:var(--muted); font-size:11px; margin-top:3px; }  
.person .workstate { display:block; margin-top:8px; font-size:10px; color:#7ff0bc; }  
.table-wrap { overflow-x:auto; }  
table { width:100%; border-collapse:collapse; min-width:580px; }  
th,td { text-align:left; padding:12px 10px; border-bottom:1px solid var(--line); font-size:13px; }  
th { color:var(--muted); font-weight:600; }  
.empty { color:var(--muted); padding:24px; text-align:center; }  
.field { display:grid; gap:6px; margin-bottom:14px; }  
.field label { font-size:13px; color:#c9d5e9; }  
.field input,.field select,.field textarea {  
  width:100%; border:1px solid var(--line); background:#0e1729;  
  color:var(--text); padding:11px; border-radius:9px;  
}  
.field textarea { min-height:90px; resize:vertical; }  
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }  
.notice {  
  border:1px solid #35476a; background:#15243d; color:#c8dbff;  
  padding:13px; border-radius:11px; font-size:12px; line-height:1.7;  
}  
.footer { color:var(--muted); font-size:11px; padding:24px 0 8px; }  
.modal-backdrop {  
  position:fixed; inset:0; background:#000a; z-index:30;  
  display:none; align-items:center; justify-content:center; padding:16px;  
}  
.modal-backdrop.open { display:flex; }  
.modal {  
  width:min(540px,100%); max-height:90vh; overflow:auto;  
  background:#141e31; border:1px solid var(--line); border-radius:17px;  
  padding:20px;  
}  
.modal-head { display:flex; justify-content:space-between; gap:12px; align-items:center; }  
.modal-head h2 { margin:0; font-size:20px; }  
.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0; }  
.detail {  
  background:#0e1729; border:1px solid var(--line); border-radius:10px;  
  padding:11px; overflow-wrap:anywhere;  
}  
.detail small { display:block; color:var(--muted); margin-bottom:5px; }  
.detail strong { font-size:13px; }  
.mobile-menu { display:none; }  
#toast {  
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);  
  background:#263a55; color:white; padding:12px 16px; border-radius:10px;  
  display:none; z-index:60; max-width:90vw; text-align:center;  
}  
@media(max-width:850px) {  
  .layout { grid-template-columns:1fr; }  
  .sidebar { display:none; min-height:0; border-right:0; border-bottom:1px solid var(--line); }  
  .sidebar.open { display:block; }  
  .mobile-menu { display:inline-block; }  
  .main { padding:17px 13px; }  
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }  
  .two-col { grid-template-columns:1fr; }  
  .topbar { padding:12px; }  
  .brand h1 { font-size:14px; }  
  .brand p { font-size:10px; }  
  .top-actions .desktop-only { display:none; }  
}  
@media(max-width:480px) {  
  .zone-grid { grid-template-columns:1fr; }  
  .form-grid { grid-template-columns:1fr; }  
  .page-head h2 { font-size:22px; }  
  .stat-number { font-size:25px; }  
  .detail-grid { grid-template-columns:1fr 1fr; }  
}  

/* OWNER LOGIN */
#ownerLogin{position:fixed;inset:0;z-index:1000;background:#0b1020;display:flex;align-items:center;justify-content:center;padding:18px}
#ownerLogin .login-card{width:min(440px,100%);background:#131b2e;border:1px solid #2b3852;border-radius:16px;padding:24px}
#ownerLogin h2{margin-top:0}
#ownerLogin .field{display:grid;gap:6px;margin:14px 0}
#ownerLogin input{width:100%;padding:12px;border:1px solid #2b3852;border-radius:9px;background:#0e1729;color:#f1f5ff}
#ownerLoginMsg{display:none;background:#421f2b;border:1px solid #733548;padding:10px;border-radius:8px;overflow-wrap:anywhere;margin-top:12px}
#ownerLogin button:disabled{opacity:.6;cursor:wait}

</style>  
</head>  
<body>

<div id="ownerLogin">
  <div class="login-card">
    <div class="logo" style="margin-bottom:14px">PF</div>
    <h2>PIMTHARA AI FACTORY</h2>
    <p class="muted">Owner Login · เข้าสู่ระบบเจ้าของโรงงาน</p>
    <form id="ownerLoginForm">
      <div class="field"><label for="ownerEmail">อีเมล</label><input id="ownerEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="ownerPassword">รหัสผ่าน</label><input id="ownerPassword" type="password" autocomplete="current-password" required></div>
      <button id="ownerLoginButton" class="btn primary" type="submit" style="width:100%">เข้าสู่ระบบ</button>
    </form>
    <div id="ownerLoginMsg"></div>
    <p class="muted small" style="margin-top:14px">ใช้บัญชี Owner เดิมใน Supabase โปรเจกต์เดิม</p>
  </div>
</div>
  
<div class="app">  
  <header class="topbar">  
    <div class="brand">  
      <button class="btn mobile-menu" onclick="toggleMenu()" aria-label="เปิดเมนู">☰</button>  
      <div class="logo">PF</div>  
      <div>  
        <h1>PIMTHARA AI FACTORY</h1>  
        <p>Virtual AI Office · Prototype V1</p>  
      </div>  
    </div>  
    <div class="top-actions">  
      <span class="pill green">● OWNER SYSTEM</span>  
      <button class="btn desktop-only" onclick="showPage('employees')">พนักงาน</button>  
      <button class="btn primary" onclick="showPage('create')">＋ สร้างงาน</button>  
    </div>  
  </header>    <div class="layout">  
    <aside class="sidebar" id="sidebar">  
      <div class="nav-label">FACTORY</div>  
      <button class="nav active" data-page="dashboard" onclick="showPage('dashboard')"><span class="ico">▦</span> Dashboard</button>  
      <button class="nav" data-page="factory" onclick="showPage('factory')"><span class="ico">🌐</span> Live Factory</button>  
      <button class="nav" data-page="employees" onclick="showPage('employees')"><span class="ico">♟</span> Employees</button>  
      <div class="nav-label">WORK MANAGEMENT</div>  
      <button class="nav" data-page="orders" onclick="showPage('orders')"><span class="ico">▤</span> Work Orders</button>  
      <button class="nav" data-page="queue" onclick="showPage('queue')"><span class="ico">☷</span> Work Control / Queue</button>  
      <button class="nav" data-page="workflow" onclick="showPage('workflow')"><span class="ico">⇢</span> Workflow</button>  
      <button class="nav" data-page="qc" onclick="showPage('qc')"><span class="ico">✓</span> Quality Control</button>  
      <div class="nav-label">RECORDS</div>  
      <button class="nav" data-page="history" onclick="showPage('history')"><span class="ico">◷</span> History / Audit</button>  
      <button class="nav" data-page="reports" onclick="showPage('reports')"><span class="ico">▥</span> Reports</button>  
      <button class="nav" data-page="settings" onclick="showPage('settings')"><span class="ico">⚙</span> Settings</button>  
      <div class="notice" style="margin-top:22px">  
        <strong>PIMTHARA — OWNER</strong><br>  
        เจ้าของโรงงานและผู้ตัดสินใจขั้นสุดท้าย  
      </div>  
    </aside>  <main class="main" id="main"></main>

  </div>  
</div>  <div class="modal-backdrop" id="modal" onclick="if(event.target===this)closeModal()">  
  <div class="modal">  
    <div class="modal-head">  
      <h2 id="modalTitle">รายละเอียด</h2>  
      <button class="btn" onclick="closeModal()">✕</button>  
    </div>  
    <div id="modalContent"></div>  
  </div>  
</div>  
<div id="toast"></div>  <script>  
"use strict";  
  
/* LOCKED EMPLOYEE MAPPING — PIMTHARA AI FACTORY */  
const employees = [  
 {id:"EMP-001",name:"เมย์",role:"Factory Manager",dept:"Management",face:"👩🏻‍💼"},  
 {id:"EMP-002",name:"นัท",role:"Work Control",dept:"Operations",face:"👨🏻‍💻"},  
 {id:"EMP-003",name:"มิน",role:"Planner",dept:"Operations",face:"👩🏻‍💻"},  
 {id:"EMP-004",name:"พีท",role:"Product Worker",dept:"Operations",face:"👨🏻‍🔧"},  
 {id:"EMP-005",name:"ใบเฟิร์น",role:"Content Worker",dept:"Operations",face:"👩🏻‍🎨"},  
 {id:"EMP-006",name:"บอล",role:"Video Editor",dept:"Operations",face:"👨🏻‍🎬"},  
 {id:"EMP-007",name:"ก้อย",role:"QC",dept:"Operations",face:"👩🏻‍🔍"},  
 {id:"EMP-008",name:"ฟ้า",role:"Finance",dept:"Support",face:"👩🏻‍💼"},  
 {id:"EMP-009",name:"นุ่น",role:"HR",dept:"Support",face:"👩🏻‍💼"},  
 {id:"EMP-010",name:"เจน",role:"Marketing",dept:"Growth",face:"👩🏻‍📱"},  
 {id:"EMP-011",name:"แนน",role:"Customer Service",dept:"Growth",face:"👩🏻‍🎧"},  
 {id:"EMP-012",name:"ริว",role:"R&D",dept:"Technology",face:"🧑🏻‍🔬"},  
 {id:"EMP-013",name:"ไอซ์",role:"IT/System",dept:"Technology",face:"🧑🏻‍💻"},  
 {id:"EMP-014",name:"แอ้ม",role:"Executive Secretary",dept:"Management",face:"👩🏻‍💼"}  
];  
  
const departments = [  
 {name:"Management",th:"ฝ่ายบริหาร",members:["EMP-014","EMP-001"]},  
 {name:"Operations",th:"ฝ่ายปฏิบัติการ",members:["EMP-002","EMP-003","EMP-004","EMP-005","EMP-006","EMP-007"]},  
 {name:"Support",th:"ฝ่ายสนับสนุน",members:["EMP-008","EMP-009"]},  
 {name:"Growth",th:"ฝ่ายเติบโตและลูกค้า",members:["EMP-010","EMP-011"]},  
 {name:"Technology",th:"ฝ่ายเทคโนโลยี",members:["EMP-012","EMP-013"]}  
];  
  
const workflowTemplates = [  
 {id:"WF-01",name:"PRODUCT",steps:"นัท → มิน → พีท → ก้อย"},  
 {id:"WF-02",name:"CONTENT",steps:"นัท → มิน → ใบเฟิร์น → ก้อย"},  
 {id:"WF-03",name:"VIDEO CONTENT",steps:"นัท → มิน → ใบเฟิร์น → บอล → ก้อย"},  
 {id:"WF-04",name:"VIDEO EDIT ONLY",steps:"นัท → มิน → บอล → ก้อย"}  
];  
  
let orders = [];  
let history = [];  
let nextOrder = 1;  
let currentPage = "dashboard";  
  
function esc(value) {  
 return String(value ?? "").replace(/[&<>"']/g, c => ({  
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"  
 }[c]));  
}  
function employee(id) { return employees.find(e=>e.id===id); }  
function statusClass(s) {  
 if(["COMPLETED","PASSED"].includes(s)) return "green";  
 if(["HOLD","FAILED","CANCELLED"].includes(s)) return "red";  
 if(["IN_PROGRESS","QC","READY_FOR_QC","ASSIGNED"].includes(s)) return "yellow";  
 return "blue";  
}  
function statusThai(s) {  
 return ({  
  DRAFT:"ฉบับร่าง",QUEUED:"รอคิว",ASSIGNED:"มอบหมายแล้ว",  
  IN_PROGRESS:"กำลังทำ",READY_FOR_QC:"รอตรวจ QC",QC:"กำลังตรวจ QC",  
  PASSED:"QC ผ่าน",COMPLETED:"เสร็จสมบูรณ์",HOLD:"พักงาน / รอข้อมูล",  
  FAILED:"QC ไม่ผ่าน",REVISION:"รอแก้ไข",PAUSED:"หยุดชั่วคราว",  
  CANCELLED:"ยกเลิก"  
 })[s] || s;  
}  
function log(action,detail) {  
 history.unshift({time:new Date().toLocaleString("th-TH"),action,detail});  
}  
function toast(msg) {  
 const el=document.getElementById("toast");  
 el.textContent=msg; el.style.display="block";  
 clearTimeout(window.toastTimer);  
 window.toastTimer=setTimeout(()=>el.style.display="none",2800);  
}  
function showPage(page) {  
 currentPage=page;  
 document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===page));  
 document.getElementById("sidebar").classList.remove("open");  
 render();  
 window.scrollTo({top:0,behavior:"smooth"});  
}  
function toggleMenu() {  
 document.getElementById("sidebar").classList.toggle("open");  
}  
function pageHead(title,sub,button="") {  
 return `<div class="page-head"><div><h2>${title}</h2><div class="muted">${sub}</div></div>${button}</div>`;  
}  
function stat(title,value,sub) {  
 return `<div class="card"><div class="stat-title">${title}</div><div class="stat-number">${value}</div><div class="muted small">${sub}</div></div>`;  
}  
function pill(s) {  
 return `<span class="pill ${statusClass(s)}">${esc(statusThai(s))}</span>`;  
}  
function employeeButton(e) {  
 const active=orders.some(o=>o.employeeId===e.id && !["COMPLETED","CANCELLED"].includes(o.status));  
 return `<button class="person" onclick="openEmployee('${e.id}')">  
  <span class="face">${e.face}</span><strong>${esc(e.name)}</strong>  
  <small>${esc(e.id)}</small><small>${esc(e.role)}</small>  
  <span class="workstate">${active?"● มีงานในระบบ":"● รอรับงาน"}</span>  
 </button>`;  
}  
function renderDashboard() {  
 const active=orders.filter(o=>!["COMPLETED","CANCELLED"].includes(o.status)).length;  
 const done=orders.filter(o=>o.status==="COMPLETED").length;  
 const qc=orders.filter(o=>["READY_FOR_QC","QC"].includes(o.status)).length;  
 const hold=orders.filter(o=>o.status==="HOLD").length;  
 return pageHead("Dashboard","ภาพรวมการทำงานของ PIMTHARA AI FACTORY")+  
 `<div class="grid stats">  
 ${stat("พนักงาน AI","14","พนักงานตามโครงสร้างที่ล็อกไว้")}  
 ${stat("งานทั้งหมด",orders.length,"Work Orders ในต้นแบบนี้")}  
 ${stat("งานที่ยังไม่เสร็จ",active,"รวมงานที่กำลังทำและรอคิว")}  
 ${stat("รอ QC / ติดปัญหา",qc+hold,`รอ QC ${qc} · HOLD ${hold}`)}  
 </div>  
 <div class="grid two-col">  
 <section>  
  <div class="section-title"><h3>งานล่าสุด</h3><button class="btn" onclick="showPage('orders')">ดูงานทั้งหมด →</button></div>  
  <div class="card">${orders.length?`<div class="list">${orders.slice(0,5).map(orderRow).join("")}</div>`:`<div class="empty">ยังไม่มี Work Order<br>กด “สร้างงาน” เพื่อเพิ่มงานทดลอง</div>`}</div>  
 </section>  
 <section>  
  <div class="section-title"><h3>แผนกในโรงงาน</h3><button class="btn" onclick="showPage('factory')">เปิด Factory →</button></div>  
  <div class="card list">${departments.map(d=>`<div class="list-row"><div class="row-main"><strong>${d.th}</strong><small>${d.name}</small></div><span class="pill">${d.members.length} คน</span></div>`).join("")}</div>  
 </section>  
 </div>  
 <div class="section-title"><h3>สถานะงาน</h3></div>  
 <div class="grid stats">  
 ${stat("รอคิว",orders.filter(o=>o.status==="QUEUED").length,"QUEUED")}  
 ${stat("กำลังทำ",orders.filter(o=>o.status==="IN_PROGRESS").length,"IN_PROGRESS")}  
 ${stat("เสร็จแล้ว",done,"COMPLETED")}  
 ${stat("พักงาน",hold,"HOLD")}  
 </div>  
 <div class="footer">ข้อมูลนี้เป็น DEMO และจะหายเมื่อรีเฟรชหน้าเว็บหรือปิดแท็บ</div>`;  
}  
function orderRow(o) {  
 return `<div class="list-row"><div class="row-main"><strong>${esc(o.id)} · ${esc(o.title)}</strong><small>${esc(o.type)} · ${esc(o.ownerName||"ยังไม่มอบหมาย")}</small></div>${pill(o.status)}<button class="btn" onclick="openOrder('${o.id}')">ดู</button></div>`;  
}

async function createOrder(event) {
 event.preventDefault();
 if(!window.pimtharaSupabase || !window.pimtharaOwnerSession) return toast("กรุณาเข้าสู่ระบบก่อน");
 const title=document.getElementById("title").value.trim();
 const requirement=document.getElementById("requirement").value.trim();
 if(!title||!requirement) return toast("กรุณากรอกชื่องานและรายละเอียด");
 const type=document.getElementById("type").value;
 const wf=document.getElementById("workflow").value;
 const id="WO-"+Date.now().toString(36).toUpperCase();
 const employeeId="EMP-002";
 const row={
  wo_id:id, command_id:null, requester:"PIMTHARA", title,
  work_type:type, requirement,
  priority:document.getElementById("priority").value,
  workflow_id:wf, current_step:"นัท", current_employee_id:employeeId,
  status:"QUEUED", version:1
 };
 try {
  const {error}=await window.pimtharaSupabase.from("work_orders").insert(row);
  if(error) throw error;
  const {error:eventError}=await window.pimtharaSupabase.from("work_order_events").insert({
   wo_id:id,actor_employee_id:null,actor_name:"PIMTHARA",
   action:"CREATE_WORK_ORDER",from_status:null,to_status:"QUEUED",
   reason:"สร้าง Work Order โดย Owner",version:1
  });
  if(eventError) throw eventError;
  await window.pimtharaReloadOrders();
  toast("บันทึก Work Order ลงฐานข้อมูลแล้ว");
  showPage("orders");
 } catch(err) {
  toast("บันทึกไม่สำเร็จ: "+err.message);
 }
}

async function updateOrder(id) {
 const o=orders.find(x=>x.id===id);
 if(!o) return;
 const select=document.getElementById("assignEmployee");
 const statusSelect=document.getElementById("changeStatus");
 if(!select||!statusSelect) return;
 const e=employee(select.value);
 const previous=o.status;
 const nextStatus=statusSelect.value;
 try {
  const {error}=await window.pimtharaSupabase.from("work_orders").update({
   current_employee_id:e.id,
   current_step:e.name,
   status:nextStatus,
   version:(o.version||1)+1,
   updated_at:new Date().toISOString()
  }).eq("wo_id",o.id);
  if(error) throw error;
  const {error:eventError}=await window.pimtharaSupabase.from("work_order_events").insert({
   wo_id:o.id,actor_employee_id:null,actor_name:"PIMTHARA",
   action:"UPDATE_WORK_ORDER",from_status:previous,to_status:nextStatus,
   reason:"เปลี่ยนผู้รับผิดชอบเป็น "+e.name,version:(o.version||1)+1
  });
  if(eventError) throw eventError;
  await window.pimtharaReloadOrders();
  closeModal();render();toast("บันทึกการเปลี่ยนแปลงลงฐานข้อมูลแล้ว");
 } catch(err) {
  toast("อัปเดตไม่สำเร็จ: "+err.message);
 }
}

 document.getElementById("modal").classList.remove("open");  
 render();

}
